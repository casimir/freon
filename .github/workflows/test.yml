name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
          - "3.14"
          - "3.15"
    defaults:
      run:
        working-directory: freon_server
    env:
      LOAD_DOTENV: "false"
      ONESHOT_SECRET_KEY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python manage.py test
